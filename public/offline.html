<!DOCTYPE html>
<html lang="id" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Anda Sedang Offline — MUHDIN</title>
  <meta name="theme-color" content="#0b5c3f" />
  <link rel="icon" href="/icons/icon-192.png" type="image/png" />
  <style>
    :root {
      --emerald: #0b5c3f;
      --emerald-soft: #e8f5ee;
      --gold: #d4af37;
      --ink: #1d3229;
      --muted: #5f7a6e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(160deg, #f7fcf9 0%, #e8f5ee 100%);
      color: var(--ink);
      display: grid;
      place-items: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }
    @media (prefers-color-scheme: dark) {
      body { background: linear-gradient(160deg, #0d1712 0%, #12241c 100%); color: #e6f2ec; }
      .card { background: #142a20 !important; border-color: rgba(255,255,255,.1) !important; }
      .muted { color: #93b3a5 !important; }
      .badge-bg { background: rgba(212,175,55,.12) !important; }
    }
    .card {
      max-width: 420px;
      width: 100%;
      background: #ffffff;
      border: 1px solid rgba(11, 92, 63, .12);
      border-radius: 24px;
      padding: 40px 32px;
      text-align: center;
      box-shadow: 0 24px 60px -24px rgba(11, 92, 63, .25);
    }
    .icon {
      width: 84px; height: 84px;
      margin: 0 auto 20px;
      border-radius: 22px;
      background: var(--badge-bg, #e8f5ee);
      display: grid; place-items: center;
    }
    .icon svg { width: 44px; height: 44px; }
    h1 { font-size: 22px; font-weight: 800; letter-spacing: -.02em; }
    .muted { color: var(--muted); font-size: 14.5px; line-height: 1.65; margin-top: 10px; }
    .status {
      display: inline-flex; align-items: center; gap: 8px;
      margin-top: 18px;
      font-size: 12.5px; font-weight: 700;
      color: #8a6d1f;
      background: rgba(212, 175, 55, .14);
      border: 1px solid rgba(212, 175, 55, .35);
      padding: 7px 14px;
      border-radius: 999px;
    }
    .dot { width: 8px; height: 8px; border-radius: 999px; background: var(--gold); animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .45; transform: scale(.8); } }
    button {
      margin-top: 24px;
      width: 100%;
      padding: 14px 20px;
      border: 0;
      border-radius: 14px;
      font-size: 15px; font-weight: 700;
      color: #fff;
      background: linear-gradient(90deg, #0e7a53, #0b5c3f);
      cursor: pointer;
      transition: transform .15s ease, box-shadow .15s ease;
      box-shadow: 0 10px 24px -10px rgba(11, 92, 63, .6);
    }
    button:hover { transform: translateY(-1px); box-shadow: 0 14px 28px -10px rgba(11, 92, 63, .7); }
    button:active { transform: translateY(0); }
    footer { margin-top: 22px; font-size: 11.5px; letter-spacing: .04em; }
  </style>
</head>
<body>
  <main class="card">
    <div class="icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="#0b5c3f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2a7 7 0 0 0-7 7c0 2.38 1.19 4.47 3 5.74V17a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2v-2.26c1.81-1.27 3-3.36 3-5.74a7 7 0 0 0-7-7z" />
        <path d="M9 21h6" />
        <path d="M8.5 9.5 10 11l3.5-3.5" />
      </svg>
    </div>
    <h1>Anda Sedang Offline</h1>
    <p class="muted">
      Koneksi internet terputus. Halaman yang pernah Anda buka tetap dapat
      diakses dari cache — periksa jaringan lalu coba lagi.
    </p>
    <p class="status" id="status"><span class="dot"></span> Menunggu koneksi…</p>
    <button id="retry" type="button">Coba Muat Ulang</button>
    <footer class="muted">MUHDIN — Bersama Melayani Tamu Allah</footer>
  </main>
  <script>
    function goOnline() {
      document.getElementById("status").innerHTML = '<span class="dot" style="background:#0e7a53"></span> Koneksi kembali — memuat ulang…';
      setTimeout(function () { window.location.replace("/"); }, 800);
    }
    if (navigator.onLine) goOnline();
    window.addEventListener("online", goOnline);
    document.getElementById("retry").addEventListener("click", function () {
      window.location.replace("/");
    });
  </script>
</body>
</html>
